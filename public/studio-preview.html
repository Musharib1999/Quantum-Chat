                moon: <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />,
                box: <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />

        const LatexMath = ({ math, inline = true }) => {
            const [rendered, setRendered] = useState(() => {
                if (typeof window !== "undefined" && window.katex) {
                    try {
                        return window.katex.renderToString(math, {
                            displayMode: !inline,
                            throwOnError: false
                        });
                    } catch (e) {
                        return "";
                    }
                }
                return "";
            });

            useEffect(() => {
                const tryRender = () => {
                    if (window.katex) {
                        try {
                            const res = window.katex.renderToString(math, {
                                displayMode: !inline,
                                throwOnError: false
                            });
                            setRendered(res);
                            return true;
                        } catch (e) {
                            return false;
                        }
                    }
                    return false;
                };

                if (!tryRender()) {
                    const timer = setInterval(() => {
                        if (tryRender()) clearInterval(timer);
                    }, 50);
                    return () => clearInterval(timer);
                }
            }, [math, inline]);

            if (rendered) {
                return <span className="inline-block text-zinc-100" dangerouslySetInnerHTML={{ __html: rendered }} />;
            }
            return <span className="inline-block text-zinc-300 font-mono text-xs">{math}</span>;
        };

        // Project Database Store (Sample)
        const initialProjects = [
            {
                id: "clean_energy_portfolio",
                title: "Clean Energy Portfolio",
                desc: "4-asset capital budgeting with mutual exclusions and grid stability dependencies.",
                framework: "dwave",
                updated: "2 mins ago",
                files: ["main.py", "qubo_matrix.py", "hamiltonian.json"],
                activeFile: "main.py"
            },
            {
                id: "quantum_teleportation",
                title: "Quantum Teleportation",
                desc: "3-qubit entangled Bell channel with Bob classical feed-forward corrections.",
                framework: "qiskit",
                updated: "1 hour ago",
                files: ["teleportation.py", "circuit.qasm"],
                activeFile: "teleportation.py"
            },
            {
                id: "maxcut_bipartite_graph",
                title: "Max-Cut 12-Node Partition",
                desc: "Unconstrained binary quadratic model for bipartite graph cut maximization.",
                framework: "dwave",
                updated: "Yesterday",
                files: ["maxcut.py", "graph_edges.json"],
                activeFile: "maxcut.py"
            },
            {
                id: "vqe_h2_molecule",
                title: "VQE H2 Ground Energy",
                desc: "Variational Quantum Eigensolver for molecular hydrogen ground state energy curve.",
                framework: "qiskit",
                updated: "3 days ago",

        // ── Quantum Syntax Tokenizer & Highlighter ──
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        
        const DWAVE_SAMPLE_CODE = "# Quantum Guru — Clean Energy Portfolio Selection (QUBO)\n# Solver: D-Wave BinaryQuadraticModel & Simulated Annealer\nimport dimod\nfrom dwave.samplers import SimulatedAnnealingSampler\nfrom qubo_matrix import get_qubo_model\n\n# 1. Ingest problem matrix & penalty multipliers\nQ_matrix, variable_names, penalty_lambda, offset = get_qubo_model()\n\n# 2. Assemble D-Wave BQM Hamiltonian\nbqm = dimod.BinaryQuadraticModel.from_qubo(Q_matrix, offset=offset)\n\n# 3. Execute Quantum-Classical Annealing\nsampler = SimulatedAnnealingSampler()\nsampleset = sampler.sample(bqm, num_reads=2048)\n\nbest = sampleset.first\nprint(f\"⚡ Ground Energy: {best.energy:.4f}\")\nprint(\"Optimal Decisions:\", [variable_names[i] for i, v in enumerate(best.sample) if v == 1])";
        const QISKIT_SAMPLE_CODE = "# Quantum Guru — Qiskit Quantum Teleportation Protocol\nfrom qiskit import QuantumCircuit, Aer, execute\nimport numpy as np\n\nqc = QuantumCircuit(3, 3)\n\n# 1. State preparation on qubit 0 (Alice state)\nqc.rx(np.pi / 3, 0)\nqc.barrier()\n\n# 2. Entangled Bell pair between Alice (q1) and Bob (q2)\nqc.h(1)\nqc.cx(1, 2)\nqc.barrier()\n\n# 3. Bell measurement protocol\nqc.cx(0, 1)\nqc.h(0)\nqc.measure([0, 1], [0, 1])\nqc.barrier()\n\n# 4. Bob conditional recovery corrections\nqc.cx(1, 2)\nqc.cz(0, 2)\nqc.measure(2, 2)\n\n# Simulated execution on Aer backend\nsim = Aer.get_backend(\"aer_simulator\")\nres = execute(qc, sim, shots=4096).result()\nprint(\"Teleportation Counts:\", res.get_counts())";

        function highlightPythonLine(line, isDark) {
            if (/^\s*#/.test(line)) {
                return `<span class="${isDark ? "text-zinc-500" : "text-slate-400"} italic">${escapeHtml(line)}</span>`;
            }

            let comment = "";
            const commentIdx = line.search(/\s+#/);
            if (commentIdx !== -1) {
                comment = line.substring(commentIdx);
                line = line.substring(0, commentIdx);
            }

            const tokenRegex = /(f?".*?"|\x27.*?\x27|\b(?:from|import|as|def|return|if|else|elif|for|in|while|with|class|and|or|not|yield)\b|\b(?:QuantumCircuit|Aer|AerSimulator|QuantumRegister|ClassicalRegister|BinaryQuadraticModel|SimulatedAnnealingSampler|LeapHybridSampler|dimod|qiskit|numpy|np)\b|\b(?:print|enumerate|range|len|sum|min|max|int|float|str|dict|list|set)\b|\.[a-zA-Z_]\w*(?=\s*\()|\b[a-zA-Z_]\w*(?=\s*\()|\b\d+(?:\.\d+)?(?:e[+-]?\d+)?\b|[=+\-*/%<>&|^~:]+|[a-zA-Z_]\w*|[^\s\w]+|\s+)/g;

            let out = "";
            let m;
            while ((m = tokenRegex.exec(line)) !== null) {
                const t = m[0];
                if (/^f?["\x27]/.test(t)) {
                    out += `<span class="${isDark ? "text-rose-300" : "text-rose-700"}">${escapeHtml(t)}</span>`;
                } else if (/^(from|import|as|def|return|if|else|elif|for|in|while|with|class|and|or|not|yield)$/.test(t)) {
                    out += `<span class="${isDark ? "text-purple-400" : "text-purple-700"} font-semibold">${escapeHtml(t)}</span>`;
                } else if (/^(QuantumCircuit|Aer|AerSimulator|QuantumRegister|ClassicalRegister|BinaryQuadraticModel|SimulatedAnnealingSampler|LeapHybridSampler|dimod|qiskit|numpy|np)$/.test(t)) {
                    out += `<span class="${isDark ? "text-emerald-400" : "text-emerald-600"} font-semibold">${escapeHtml(t)}</span>`;
                } else if (/^(print|enumerate|range|len|sum|min|max|int|float|str|dict|list|set)$/.test(t)) {
                    out += `<span class="${isDark ? "text-cyan-400" : "text-cyan-700"}">${escapeHtml(t)}</span>`;
                } else if (t.startsWith(".") && t.length > 1) {
                    out += ``.concat(`.<span class="${isDark ? "text-sky-300" : "text-sky-600"} font-medium">${escapeHtml(t.slice(1))}</span>`);
                } else if (line.substring(tokenRegex.lastIndex).trim().startsWith("(") && /^[a-zA-Z_]/.test(t)) {
                    out += `<span class="${isDark ? "text-sky-300" : "text-sky-600"} font-medium">${escapeHtml(t)}</span>`;
                } else if (/^\d+(?:\.\d+)?(?:e[+-]?\d+)?$/.test(t)) {
                    out += `<span class="${isDark ? "text-amber-400" : "text-amber-600"} font-mono">${escapeHtml(t)}</span>`;
                } else if (/^[=+\-*/%<>&|^~:]+$/.test(t)) {
                    out += `<span class="${isDark ? "text-zinc-500" : "text-slate-400"}">${escapeHtml(t)}</span>`;
                } else if (/^[a-zA-Z_]\w*$/.test(t)) {
                    out += `<span class="${isDark ? "text-zinc-200" : "text-slate-800"}">${escapeHtml(t)}</span>`;
                } else {
                    out += escapeHtml(t);
                }
            }

            if (comment) {
                out += `<span class="${isDark ? "text-zinc-500" : "text-slate-400"} italic">${escapeHtml(comment)}</span>`;
            }

            return out;
        }

        
        const CodeEditor = ({ code, onChange, isDark, framework, onCopy, onReset }) => {
            const textareaRef = useRef(null);
            const preRef = useRef(null);
            const gutterRef = useRef(null);

            const handleScroll = (e) => {
                if (preRef.current) {
                    preRef.current.scrollTop = e.target.scrollTop;
                    preRef.current.scrollLeft = e.target.scrollLeft;
                }
                if (gutterRef.current) {
                    gutterRef.current.scrollTop = e.target.scrollTop;
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === "Tab") {
                    e.preventDefault();
                    const start = e.target.selectionStart;
                    const end = e.target.selectionEnd;
                    const val = e.target.value;
                    const updated = val.substring(0, start) + "    " + val.substring(end);
                    onChange(updated);
                    setTimeout(() => {
                        if (textareaRef.current) {
                            textareaRef.current.selectionStart = textareaRef.current.selectionEnd = start + 4;
                        }
                    }, 0);
                }
            };

            const lines = code.split("\n");

            return (
                <div className="flex-1 flex flex-col h-full overflow-hidden">
                    {/* Dual-layer Interactive Editor Canvas */}
                    <div className={`relative flex-1 flex overflow-hidden font-mono text-xs ${
                        isDark ? "bg-[#090A0D]" : "bg-white"
                    }`}>
                        {/* Synchronized Line Numbers Gutter */}
                        <div
                            ref={gutterRef}
                            className={`w-12 py-3.5 pr-3 select-none text-right shrink-0 overflow-hidden border-r text-[11px] leading-[20px] font-mono ${
                                isDark ? "bg-[#0B0C0E] border-white/[0.06] text-zinc-600" : "bg-slate-50 border-slate-200 text-slate-400"
                            }`}
                        >
                            {lines.map((_, i) => (
                                <div key={i} className="h-[20px]">{i + 1}</div>
                            ))}
                        </div>

                        {/* Staged Code Area */}
                        <div className="relative flex-1 h-full overflow-hidden">
                            {/* Layer 1: Syntax Highlighted Representation (Underneath) */}
                            <pre
                                ref={preRef}
                                className="absolute inset-0 p-3.5 m-0 overflow-hidden pointer-events-none font-mono text-xs leading-[20px] whitespace-pre select-none"
                                aria-hidden="true"
                            >
                                {lines.map((l, i) => (
                                    <div
                                        key={i}
                                        className="h-[20px]"
                                        dangerouslySetInnerHTML={{ __html: highlightPythonLine(l, isDark) || "&nbsp;" }}
                                    />
                                ))}
                            </pre>

                            {/* Layer 2: Transparent Interactive Textarea (Active Top Layer) */}
                            <textarea
                                ref={textareaRef}
                                value={code}
                                onChange={(e) => onChange(e.target.value)}
                                onScroll={handleScroll}
                                onKeyDown={handleKeyDown}
                                spellCheck="false"
                                autoCapitalize="off"
                                autoComplete="off"
                                autoCorrect="off"
                                className={`absolute inset-0 w-full h-full p-3.5 m-0 font-mono text-xs leading-[20px] whitespace-pre bg-transparent text-transparent caret-sky-400 outline-none resize-none overflow-auto ${
                                    isDark ? "selection:bg-sky-500/30" : "selection:bg-sky-300/40"
                                }`}
                            />
                        </div>
                    </div>
                </div>
            );
        };

        
        
        
        const FormulationView = ({ 
            framework, 
            isDark, 
            mathParams, 
            setMathParams, 
            onRecompile, 
            isDirty, 
            onCopyLatex,
            selectedSection,
            onSelectSection
        }) => {
            const { budgetCap, minDiversity, gammaWeight, penaltyLambda, enableDiversity, hasMutualExclusion, lambdaEx = 8.0 } = mathParams;

            // Computed analytical strings
            const mathObj1 = `\\min_{x \\in \\{0, 1\\}^4} \\quad \\mathcal{H}_{\\text{obj}}(x) = \\sum_{i=1}^4 C_i x_i - ${gammaWeight.toFixed(1)} \\sum_{i=1}^4 R_i x_i`;
            
            let obj2Str = `\\text{subject to} \\quad \\sum_{i=1}^4 C_i x_i \\le B_{\\text{max}} = ${budgetCap.toFixed(1)} \\text{ M}`;
            if (enableDiversity) obj2Str += ` \\quad \\text{and} \\quad \\sum_{i=1}^4 x_i \\ge ${minDiversity}`;
            if (hasMutualExclusion) obj2Str += ` \\quad \\text{and} \\quad x_{\\text{wind}} + x_{\\text{solar}} \\le 1`;
            const mathObj2 = obj2Str;

            const mathPen2 = `\\mathcal{H}_{\\text{total}}(x, s) = \\mathcal{H}_{\\text{obj}}(x) + \\mathcal{H}_{\\text{penalty}}(x, s)`;

            let pen1Str = `\\mathcal{H}_{\\text{penalty}}(x, s) = ${penaltyLambda.toFixed(1)} \\left( \\sum_{i=1}^4 C_i x_i + \\sum_{k=0}^1 2^k s_k - ${budgetCap.toFixed(1)} \\right)^2`;
            if (enableDiversity) pen1Str += ` + 2.0 \\left( ${minDiversity} - \\sum_{i=1}^4 x_i + s_{\\text{div}} \\right)^2`;
            if (hasMutualExclusion) pen1Str += ` + ${lambdaEx.toFixed(1)} (x_{\\text{wind}} \\cdot x_{\\text{solar}})`;
            const mathPen1 = pen1Str;

            const mathQii = `Q_{ii} = C_i - ${gammaWeight.toFixed(1)} R_i - 2(${penaltyLambda.toFixed(1)})(${budgetCap.toFixed(1)}) C_i + ${penaltyLambda.toFixed(1)} C_i^2`;
            const mathQij = hasMutualExclusion
                ? `Q_{\\text{wind},\\text{solar}} = 2 (${penaltyLambda.toFixed(1)}) C_{\\text{wind}} C_{\\text{solar}} + \\mathbf{${lambdaEx.toFixed(1)}}`
                : `Q_{ij} = 2 (${penaltyLambda.toFixed(1)}) C_i C_j \\quad (i \\ne j)`;

            return (
                <div className="flex-1 overflow-y-auto p-6 space-y-6">
                    {framework === "dwave" ? (
                        <>
                            {/* RECOMPILATION HERO STATUS BAR IF DIRTY */}
                            {isDirty && (
                                <div className={`p-4 rounded-xl border flex items-center justify-between shadow-lg transition-all animate-in fade-in slide-in-from-top-2 ${
                                    isDark ? "bg-amber-950/40 border-amber-500/40 text-amber-200" : "bg-amber-50 border-amber-300 text-amber-900"
                                }`}>
                                    <div className="flex items-center space-x-3">
                                        <span className="w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping"></span>
                                        <div>
                                            <div className="text-xs font-semibold">Mathematical Parameters Modified</div>
                                            <div className="text-[11px] opacity-80 font-mono">
                                                Budget: ${budgetCap}M · Penalty λ: {penaltyLambda}x · Recompile required to update Q-Matrix &amp; QUBO code.
                                            </div>
                                        </div>
                                    </div>

                                    <button
                                        onClick={onRecompile}
                                        className="px-4 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-black font-semibold text-xs transition-colors flex items-center space-x-1.5 shadow-md"
                                    >
                                        <Icon name="zap" className="w-3.5 h-3.5 fill-current" />
                                        <span>Recompile to QUBO</span>
                                        <span className="text-[10px] opacity-75 font-mono ml-1">⌘B</span>
                                    </button>
                                </div>
                            )}

                            {/* D-WAVE SECTION 1: EDITABLE PRIMAL OPTIMIZATION PROBLEM */}
                            <div id="math-section-01" className={`p-5 rounded-xl border space-y-4 transition-all ${
                                selectedSection === "01"
                                    ? "border-sky-500/60 ring-1 ring-sky-500/30 shadow-lg shadow-sky-500/10 " + (isDark ? "bg-[#11131a]" : "bg-sky-50/20")
                                    : isDark ? "bg-[#111217] border-white/[0.08]" : "bg-white border-slate-200 shadow-xs"
                            }`}>
                                <div className="flex items-center justify-between pb-2 border-b border-white/[0.06]">
                                    <div className="flex items-center space-x-2">
                                        <span className="text-amber-400 font-mono text-sm font-bold">01</span>
                                        <h3 className={`font-semibold text-sm ${isDark ? "text-zinc-100" : "text-slate-900"}`}>
                                            Primal Mathematical Optimization Model
                                        </h3>
                                        {selectedSection === "01" && (
                                            <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-sky-500/20 text-sky-400 border border-sky-500/30 flex items-center space-x-1 animate-pulse">
                                                <span>🎯 Scoped in Copilot</span>
                                            </span>
                                        )}
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                            BQM Canonical Form
                                        </span>
                                        <button
                                            onClick={() => onSelectSection(selectedSection === "01" ? null : "01")}
                                            className={`flex items-center space-x-1 text-xs px-2.5 py-1 rounded-md transition-all ${
                                                selectedSection === "01"
                                                    ? "bg-sky-500 text-white font-semibold shadow-xs"
                                                    : isDark 
                                                        ? "bg-white/[0.04] hover:bg-white/[0.08] text-zinc-300 border border-white/[0.08]" 
                                                        : "bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200"
                                            }`}

        const ASSET_NAMES = ["Wind_A", "Solar_B", "Battery_C", "Hydro_D"];
        const ASSET_SPECS = [
            { name: "Wind_A", cost: 9.0, yield: 45.0 },
            { name: "Solar_B", cost: 7.0, yield: 50.0 },
            { name: "Battery_C", cost: 6.0, yield: 30.0 },
            { name: "Hydro_D", cost: 8.0, yield: 55.0 }
        ];

        const computeQMatrix = ({ budgetCap, gammaWeight, penaltyLambda, hasMutualExclusion, lambdaEx = 8.0 }) => {
            const n = ASSET_SPECS.length;
            const matrix = Array(n).fill(0).map(() => Array(n).fill(0));
            const c = ASSET_SPECS.map(a => a.cost);
            const r = ASSET_SPECS.map(a => a.yield);
            const b = budgetCap;
            const lam = penaltyLambda;
            const gam = gammaWeight;

            for (let i = 0; i < n; i++) {
                const objBias = (c[i] - gam * r[i] * 0.45);
                const constrDiag = 0.05 * lam * (c[i] * c[i] - 2 * (b / 2.0) * c[i]);
                matrix[i][i] = parseFloat((objBias + constrDiag).toFixed(1));
            }

            for (let i = 0; i < n; i++) {
                for (let j = i + 1; j < n; j++) {
                    let coupler = parseFloat((0.035 * lam * c[i] * c[j]).toFixed(1));
                    // Mode C: Pairwise mutual exclusion penalty between Wind_A (0) and Solar_B (1)
                    if (hasMutualExclusion && ((i === 0 && j === 1) || (i === 1 && j === 0))) {
                        coupler = parseFloat((coupler + lambdaEx).toFixed(1));
                    }
                    matrix[i][j] = coupler;
                    matrix[j][i] = coupler;
                }
            }
            return matrix;
        };

                                        </div>
                                    )}

                                    {/* SECTION 02 PROMPT CHIPS */}
                                    {selectedMathSection === "02" && (
                                        <div className="space-y-1 animate-in fade-in">
                                            <button
                                                onClick={() => handleSendCopilotPrompt("Is lambda = 3.5x optimal? Calculate lambda > max |Delta H_obj|")}
                                                className={`w-full px-2 py-1.5 rounded-lg border text-[11px] text-left truncate flex items-center space-x-1.5 transition-colors ${
                                                    isDark ? "bg-[#14161F] hover:bg-[#1a1d29] border-white/[0.08] text-zinc-300" : "bg-white hover:bg-slate-100 border-slate-200 text-slate-700"
                                                }`}
                                                title="Is λ = 3.5x optimal? Calculate λ > max |ΔH_obj|"
                                            >
                                                <span className="text-amber-400 shrink-0">💡</span>
                                                <span className="truncate">Is λ = 3.5x optimal? Calculate λ > max |ΔH_obj|</span>
                                            </button>

                                            <button
                                                onClick={() => handleSendCopilotPrompt("Switch slack bit decomposition from logarithmic (2^k) to binary one-hot")}
                                                className={`w-full px-2 py-1.5 rounded-lg border text-[11px] text-left truncate flex items-center space-x-1.5 transition-colors ${
                                                    isDark ? "bg-[#14161F] hover:bg-[#1a1d29] border-white/[0.08] text-zinc-300" : "bg-white hover:bg-slate-100 border-slate-200 text-slate-700"
                                                }`}
                                                title="Switch slack bit decomposition from logarithmic (2^k) to binary one-hot"
                                            >
                                                <span className="text-sky-400 shrink-0">💡</span>
                                                <span className="truncate">Switch slack bit decomposition from 2^k to binary one-hot</span>
                                            </button>

                                            <button
                                                onClick={() => handleSendCopilotPrompt("Tighten penalty stiffness to strictly eliminate ground-state violations")}
                                                className={`w-full px-2 py-1.5 rounded-lg border text-[11px] text-left truncate flex items-center space-x-1.5 transition-colors ${
                                                    isDark ? "bg-[#14161F] hover:bg-[#1a1d29] border-white/[0.08] text-zinc-300" : "bg-white hover:bg-slate-100 border-slate-200 text-slate-700"
                                                }`}
                                                title="Tighten penalty stiffness to strictly eliminate ground-state violations"
                                            >
                                                <span className="text-rose-400 shrink-0">💡</span>
                                                <span className="truncate">Tighten penalty stiffness to eliminate violations</span>
                                            </button>
                                        </div>
                                    )}

                                    {/* SECTION 03 PROMPT CHIPS */}
                                    {selectedMathSection === "03" && (
                                        <div className="space-y-1 animate-in fade-in">
                                            <button
                                                onClick={() => handleSendCopilotPrompt("Explain step-by-step how coupler Q_01 = 15.7 was derived")}
                                                className={`w-full px-2 py-1.5 rounded-lg border text-[11px] text-left truncate flex items-center space-x-1.5 transition-colors ${
                                                    isDark ? "bg-[#14161F] hover:bg-[#1a1d29] border-white/[0.08] text-zinc-300" : "bg-white hover:bg-slate-100 border-slate-200 text-slate-700"
                                                }`}
                                                title="Explain step-by-step how coupler Q_01 = 15.7 was derived"
                                            >
                                                <span className="text-amber-400 shrink-0">💡</span>
                                                <span className="truncate">Explain step-by-step how coupler Q_01 = 15.7 was derived</span>
                                            </button>

                                            <button
                                                onClick={() => handleSendCopilotPrompt("Check matrix conditioning and dynamic range for D-Wave DAC limits")}
                                                className={`w-full px-2 py-1.5 rounded-lg border text-[11px] text-left truncate flex items-center space-x-1.5 transition-colors ${
                                                    isDark ? "bg-[#14161F] hover:bg-[#1a1d29] border-white/[0.08] text-zinc-300" : "bg-white hover:bg-slate-100 border-slate-200 text-slate-700"
                                                }`}
                                                title="Check matrix conditioning and dynamic range for D-Wave DAC limits"
                                            >
                                                <span className="text-emerald-400 shrink-0">💡</span>
                                                <span className="truncate">Check matrix conditioning & D-Wave DAC dynamic range</span>
                                            </button>

                                            <button
                                                onClick={() => handleSendCopilotPrompt("Symmetrize upper-triangular couplers into full Ising interaction matrix")}
                                                className={`w-full px-2 py-1.5 rounded-lg border text-[11px] text-left truncate flex items-center space-x-1.5 transition-colors ${
                                                    isDark ? "bg-[#14161F] hover:bg-[#1a1d29] border-white/[0.08] text-zinc-300" : "bg-white hover:bg-slate-100 border-slate-200 text-slate-700"
                                                }`}
                                                title="Symmetrize upper-triangular couplers into full Ising interaction matrix"
                                            >
                                                <span className="text-fuchsia-400 shrink-0">💡</span>
                                                <span className="truncate">Symmetrize couplers into full Ising interaction matrix</span>
                                            </button>
                                        </div>
                                    )}

                                    {/* DEFAULT / NO SECTION SELECTED */}
                                    {!selectedMathSection && (
                                        <div className="space-y-1 animate-in fade-in">
                                            <button
                                                onClick={() => handleSendCopilotPrompt("Add a constraint where Wind_A and Solar_B cannot both be built simultaneously.")}
                                                className={`w-full px-2 py-1.5 rounded-lg border text-[11px] text-left truncate flex items-center space-x-1.5 transition-colors ${
                                                    isDark ? "bg-[#14161F] hover:bg-[#1a1d29] border-white/[0.08] text-zinc-300" : "bg-white hover:bg-slate-100 border-slate-200 text-slate-700"
                                                }`}
                                            >
                                                <span className="text-fuchsia-400 shrink-0">💡</span>
                                                <span className="truncate">Add mutual exclusion: Wind_A & Solar_B</span>
                                            </button>

                                            <button
                                                onClick={() => handleSendCopilotPrompt("Is lambda = 3.5x optimal? Calculate lambda > max |Delta H_obj|")}
                                                className={`w-full px-2 py-1.5 rounded-lg border text-[11px] text-left truncate flex items-center space-x-1.5 transition-colors ${
                                                    isDark ? "bg-[#14161F] hover:bg-[#1a1d29] border-white/[0.08] text-zinc-300" : "bg-white hover:bg-slate-100 border-slate-200 text-slate-700"
                                                }`}
                                            >
                                                <span className="text-amber-400 shrink-0">💡</span>
                                                <span className="truncate">Is λ = 3.5x optimal? Audit penalty stiffness</span>
                                            </button>
                                        </div>
                                    )}
                                </div>

                                <form
                                    onSubmit={(e) => {
                                        e.preventDefault();
                                        handleSendCopilotPrompt();
                                    }}
                                    className="flex items-center space-x-2"
                                >
                                    <input 
                                        type="text" 
                                        value={copilotInput}
                                        onChange={(e) => setCopilotInput(e.target.value)}
                                        placeholder="Add constraint (e.g. mutual exclusion)..."
                                        className={`flex-1 px-3 py-2 rounded-lg text-xs outline-none border transition-colors ${
                                            isDark 
                                                ? "bg-[#14151A] border-white/[0.08] text-zinc-200 placeholder:text-zinc-600 focus:border-fuchsia-500" 
                                                : "bg-white border-slate-300 text-slate-800 placeholder:text-slate-400 focus:border-fuchsia-500"
                                        }`}
                                    />
                                    <button
                                        type="submit"
                                        className="p-2 rounded-lg bg-sky-600 hover:bg-sky-500 text-white font-medium text-xs transition-colors shrink-0"
                                        title="Send to Optimization Copilot"
                                    >
                                        <Icon name="play" className="w-3 h-3 fill-current rotate-[-90deg]" />
                                    </button>
                                </form>
                            </div>
                        </aside>
                    </div>

                    {/* ── 1-LINE BOTTOM STATUS RIBBON ── */}
                    <footer className={`h-7 border-t px-4 flex items-center justify-between text-[11px] font-mono shrink-0 z-30 ${
                        isDark ? "bg-[#0E0F13] border-white/[0.07] text-zinc-500" : "bg-white border-slate-200 text-slate-500"
                    }`}>
                        <div className="flex items-center space-x-5">
                            <span className="flex items-center space-x-1.5">
                                <span className={`w-1.5 h-1.5 rounded-full ${framework === "dwave" ? "bg-emerald-500" : "bg-sky-500"}`}></span>
                                <span className={isDark ? "text-zinc-300 font-medium" : "text-slate-800 font-medium"}>
                                    {framework === "dwave" ? "dwave_simulated_annealing" : "qiskit_aer_simulator"}
                                </span>
                            </span>
                            <span>{framework === "dwave" ? `Ground Energy: ${activeCopilotSolution.groundEnergy}` : "State Fidelity: 99.8%"}</span>
                            <span>Latency: 109ms</span>
                        </div>

                        <button 
                            onClick={() => setShowTerminal(!showTerminal)}
                            className={`flex items-center space-x-1 transition-colors ${
                                isDark ? "text-zinc-400 hover:text-zinc-200" : "text-slate-600 hover:text-slate-900"
                            }`}
                        >
                            <Icon name="terminal" className="w-3 h-3" />
                            <span>{showTerminal ? "Hide Console ↓" : "View Console Logs ↑"}</span>
                        </button>
                    </footer>

                    {/* Slide-Up Terminal Console */}
                    {showTerminal && (
                        <div className={`fixed bottom-7 left-0 right-0 h-44 border-t shadow-2xl z-40 p-4 font-mono text-xs overflow-y-auto space-y-1.5 ${
                            isDark ? "bg-[#090A0D] border-white/[0.1] text-zinc-300" : "bg-slate-900 text-slate-200 border-slate-800"
                        }`}>
                            <div className="flex items-center justify-between pb-2 border-b border-zinc-700/40 text-[10px] text-zinc-500">
                                <span>Execution Console Output</span>
                                <button onClick={() => setShowTerminal(false)} className="hover:text-zinc-300">
                                    <Icon name="x" className="w-3.5 h-3.5" />
                                </button>
                            </div>
                            <div>16:33:01 [INFO] Target runtime: {framework === "dwave" ? "dwave_simulated_annealing" : "aer_simulator"}</div>
                            <div className="text-emerald-400">16:33:02 [SUCCESS] Compiled AST and verified all constraints.</div>
                            <div>16:33:02 [DONE] Execution converged in 109.59ms. Exited cleanly with status 0.</div>
                        </div>
                    )}

                    {/* ════════════════════════════════════════════════════════════════ */}
                    {/* ── PROJECT SWITCHER MODAL (Cursor / Linear / Vercel Style) ── */}
                    {/* ════════════════════════════════════════════════════════════════ */}
                    {showProjectModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
                            <div className={`w-full max-w-xl rounded-xl border p-5 space-y-4 shadow-2xl transition-all ${
                                isDark ? "bg-[#111218] border-white/[0.1]" : "bg-white border-slate-200"
                            }`}>
                                <div className="flex items-center justify-between pb-2 border-b border-white/[0.06]">
                                    <div className="flex items-center space-x-2">
                                        <Icon name="box" className="w-4 h-4 text-sky-500" />
                                        <h3 className={`font-semibold text-sm ${isDark ? "text-zinc-100" : "text-slate-900"}`}>
                                            Workspace Projects
                                        </h3>
                                    </div>
                                    <button 
                                        onClick={() => setShowProjectModal(false)}
                                        className="text-zinc-500 hover:text-zinc-300"
                                    >
                                        <Icon name="x" className="w-4 h-4" />
                                    </button>
                                </div>

                                {/* Filter Search & Quick "+ New" Trigger */}
                                <div className="flex items-center space-x-2">
                                    <div className={`flex-1 flex items-center px-3 py-2 rounded-lg border text-xs ${
                                        isDark ? "bg-[#181920] border-white/[0.08]" : "bg-slate-50 border-slate-200"
                                    }`}>
                                        <Icon name="search" className="w-3.5 h-3.5 text-zinc-500 mr-2" />
                                        <input
                                            type="text"
                                            value={projectSearch}
                                            onChange={(e) => setProjectSearch(e.target.value)}
                                            placeholder="Filter projects by name or description..."
                                            className="w-full bg-transparent outline-none text-zinc-200 placeholder:text-zinc-500 text-xs"
                                        />
                                    </div>
                                    <button
                                        onClick={() => {
                                            setShowProjectModal(false);
                                            setShowNewProjectModal(true);
                                        }}
                                        className="px-3 py-2 rounded-lg bg-sky-500 hover:bg-sky-400 text-white font-medium text-xs flex items-center space-x-1.5 shrink-0"
                                    >
                                        <Icon name="plus" className="w-3.5 h-3.5" />
                                        <span>New Project</span>
                                    </button>
                                </div>

                                {/* Project List */}
                                <div className="max-h-64 overflow-y-auto space-y-1.5 pr-1">
                                    {filteredProjects.map((p) => {
                                        const isCurrent = p.id === activeProject.id;
                                        return (
                                            <div
                                                key={p.id}
                                                onClick={() => handleSelectProject(p)}
                                                className={`p-3 rounded-lg border cursor-pointer transition-all flex items-start justify-between ${
                                                    isCurrent
                                                        ? isDark 
                                                            ? "bg-zinc-800/80 border-sky-500/50 shadow-xs" 
                                                            : "bg-sky-50/70 border-sky-300 shadow-xs"
                                                        : isDark 
                                                            ? "bg-white/[0.02] hover:bg-white/[0.06] border-white/[0.06]" 
                                                            : "bg-white hover:bg-slate-50 border-slate-200"
                                                }`}
                                            >
                                                <div className="space-y-1">
                                                    <div className="flex items-center space-x-2">
                                                        <span className={`font-semibold text-xs ${
                                                            isCurrent 
                                                                ? "text-sky-400 font-mono" 
                                                                : isDark ? "text-zinc-200 font-mono" : "text-slate-900 font-mono"
                                                        }`}>
                                                            {p.title}
                                                        </span>
                                                        <span className={`text-[10px] px-1.5 py-0.2 rounded font-sans uppercase font-medium ${
                                                            p.framework === "dwave"
                                                                ? isDark ? "bg-emerald-950/60 text-emerald-400" : "bg-emerald-100 text-emerald-800"
                                                                : isDark ? "bg-sky-950/60 text-sky-400" : "bg-sky-100 text-sky-800"
                                                        }`}>
                                                            {p.framework}
                                                        </span>
                                                        {isCurrent && (
                                                            <span className="text-[10px] text-sky-400 font-medium font-sans">
                                                                • Active
                                                            </span>
                                                        )}
                                                    </div>
                                                    <p className="text-[11px] text-zinc-400 line-clamp-1">
                                                        {p.desc}
                                                    </p>
                                                </div>

                                                <span className="text-[10px] font-mono text-zinc-500 shrink-0 ml-3">
                                                    {p.updated}
                                                </span>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ════════════════════════════════════════════════════════════════ */}
                    {/* ── CREATE NEW PROJECT MODAL ── */}
                    {/* ════════════════════════════════════════════════════════════════ */}
                    {showNewProjectModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
                            <form 
                                onSubmit={handleCreateProject}
                                className={`w-full max-w-lg rounded-xl border p-5 space-y-4 shadow-2xl transition-all ${
                                    isDark ? "bg-[#111218] border-white/[0.1]" : "bg-white border-slate-200"
                                }`}
                            >
                                <div className="flex items-center justify-between pb-2 border-b border-white/[0.06]">
                                    <div className="flex items-center space-x-2">
                                        <Icon name="plus" className="w-4 h-4 text-emerald-500" />
                                        <h3 className={`font-semibold text-sm ${isDark ? "text-zinc-100" : "text-slate-900"}`}>
                                            Create New Quantum Project
                                        </h3>
                                    </div>
                                    <button 
                                        type="button"
                                        onClick={() => setShowNewProjectModal(false)}
                                        className="text-zinc-500 hover:text-zinc-300"
                                    >
                                        <Icon name="x" className="w-4 h-4" />
                                    </button>
                                </div>

                                {/* Project Name */}
                                <div className="space-y-1.5">
                                    <label className="text-xs font-medium text-zinc-400">Project Name</label>
                                    <input
                                        type="text"
                                        required
                                        value={newProjName}
                                        onChange={(e) => setNewProjName(e.target.value)}
                                        placeholder="e.g. maxcut_clustering_experiment"
                                        className={`w-full px-3 py-2 rounded-lg text-xs outline-none border transition-colors ${
                                            isDark 
                                                ? "bg-[#181920] border-white/[0.08] text-zinc-200 placeholder:text-zinc-600 focus:border-sky-500" 
                                                : "bg-slate-50 border-slate-200 text-slate-800 placeholder:text-slate-400 focus:border-sky-500"
                                        }`}
                                    />
                                </div>

                                {/* Target Quantum Framework Selection */}
                                <div className="space-y-1.5">
                                    <label className="text-xs font-medium text-zinc-400">Development Paradigm</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div
                                            onClick={() => setNewProjFramework("dwave")}
                                            className={`p-3 rounded-lg border cursor-pointer transition-all space-y-1 ${
                                                newProjFramework === "dwave"
                                                    ? isDark 
                                                        ? "bg-emerald-950/40 border-emerald-500 text-zinc-100" 
                                                        : "bg-emerald-50 border-emerald-500 text-emerald-900"
                                                    : isDark 
                                                        ? "bg-white/[0.02] border-white/[0.08] text-zinc-400 hover:bg-white/[0.04]" 
                                                        : "bg-white border-slate-200 text-slate-600 hover:bg-slate-50"
                                            }`}
                                        >
                                            <div className="flex items-center space-x-1.5 font-semibold text-xs">
                                                <span>⚡</span>
                                                <span>D-Wave (Annealing)</span>
                                            </div>
                                            <p className="text-[10px] text-zinc-500">
                                                Combinatorial optimization, QUBO matrices, BQM &amp; CQM models.
                                            </p>
                                        </div>

                                        <div
                                            onClick={() => setNewProjFramework("qiskit")}
                                            className={`p-3 rounded-lg border cursor-pointer transition-all space-y-1 ${
                                                newProjFramework === "qiskit"
                                                    ? isDark 
                                                        ? "bg-sky-950/40 border-sky-500 text-zinc-100" 
                                                        : "bg-sky-50 border-sky-500 text-sky-900"
                                                    : isDark 
                                                ? "bg-white/[0.02] border-white/[0.08] text-zinc-400 hover:bg-white/[0.04]" 
                                                : "bg-white border-slate-200 text-slate-600 hover:bg-slate-50"
                                            }`}
                                        >
                                            <div className="flex items-center space-x-1.5 font-semibold text-xs">
                                                <span>⚛️</span>
                                                <span>Qiskit (Gate Model)</span>
                                            </div>
                                            <p className="text-[10px] text-zinc-500">
                                                Quantum circuits, unitary gates, Aer simulation, statevectors.
                                            </p>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex justify-end space-x-2 pt-2">
                                    <button
                                        type="button"
                                        onClick={() => setShowNewProjectModal(false)}
                                        className={`px-3 py-1.5 rounded-lg text-xs font-medium border ${
                                            isDark ? "border-white/[0.08] text-zinc-400 hover:bg-white/[0.04]" : "border-slate-200 text-slate-600 hover:bg-slate-100"
                                        }`}
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        type="submit"
                                        className="px-4 py-1.5 rounded-lg bg-sky-500 hover:bg-sky-400 text-white font-semibold text-xs shadow-xs"
                                    >
                                        Create &amp; Open
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* Toast Notification */}
                    {toastMsg && (
                        <div className={`fixed bottom-10 right-6 px-3.5 py-2 rounded-lg font-mono text-xs shadow-2xl flex items-center space-x-2 z-50 border ${
                            isDark ? "bg-zinc-800 border-zinc-700 text-zinc-200" : "bg-white border-slate-300 text-slate-800 shadow-lg"
                        }`}>
                            <Icon name="check" className="w-3.5 h-3.5 text-emerald-500" />
                            <span>{toastMsg}</span>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<QuantumGuruStudio />);
    </script>
</body>
</html>
